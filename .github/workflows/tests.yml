name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      # The release build is deliberately not signed here. The signing key lives on one machine and
      # nowhere else, which is the point of it; see docs/RELEASING.md.

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  import:
    name: Import tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # Without this the emulator falls back to software rendering and takes minutes per test.
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Only the tests that need no speech engine. Everything about voices and playback depends on a
      # German offline voice being installed, which a fresh emulator does not have, so those stay on
      # the development machine and are recorded in each docs/TEST-<version>.md instead.
      - name: PDF and EPUB import
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # One class per invocation, and each on a single line: the action does not carry a line
          # continuation across, and Gradle then looks for a task called backslash.
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.schimmilab.accessiblereader.PdfImportTest
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.schimmilab.accessiblereader.EpubImportTest
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.schimmilab.accessiblereader.LibraryTest

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-reports
          path: app/build/outputs/androidTest-results/
          retention-days: 14
